<section id="contacto" aria-label="Contacto" style="width: 100%; background: #2E2B15;">
  <div class="contacto-grid" style="max-width: 1200px; margin: 0 auto; padding: 96px 32px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px;">

    <div style="display: flex; flex-direction: column; gap: 24px;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #F09367;">{{contacto_eyebrow}}</span>
      <h2 style="margin: 0; font-size: 30px; font-weight: 700; color: #FFFFFF;">{{contacto_title}}</h2>
      <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9C7B4; max-width: 420px;">{{contacto_subtitle}}</p>

      <div style="display: flex; flex-direction: column; gap: 18px; margin-top: 8px;">
{{CONTACTO_ITEMS}}
      </div>

      <a href="mailto:{{contacto_form_email}}?subject={{asunto_email}}" class="btn btn-solid-inverse" style="align-self: flex-start; background: #FFFFFF; color: #2E2B15; padding: 14px 28px; border-radius: 999px; font-size: 15px; font-weight: 600;">Escribinos un email</a>

      <div style="border-radius: 16px; overflow: hidden; margin-top: 8px; line-height: 0;">
        <iframe src="{{contacto_mapa_embed_url}}" width="100%" height="220" style="border: 0; display: block;" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Ubicación de {{site_title}}"></iframe>
      </div>
    </div>

    <form action="mailto:{{contacto_form_email}}" method="post" enctype="text/plain" style="background: #FBF9F4; border-radius: 20px; padding: 40px; display: flex; flex-direction: column; gap: 18px; height: fit-content;">
      <h3 style="margin: 0; font-size: 20px; font-weight: 600; color: #2E2B15;">{{contacto_form_title}}</h3>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="nombre" style="font-size: 13px; font-weight: 600; color: #2E2B15;">Nombre</label>
        <input id="nombre" name="Nombre" type="text" autocomplete="name" placeholder="Tu nombre" style="border: 1px solid #D9D3BE; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: 'Poppins', sans-serif; color: #2E2B15;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="email" style="font-size: 13px; font-weight: 600; color: #2E2B15;">Email</label>
        <input id="email" name="Email" type="email" autocomplete="email" spellcheck="false" placeholder="tu@email.com" style="border: 1px solid #D9D3BE; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: 'Poppins', sans-serif; color: #2E2B15;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="telefono" style="font-size: 13px; font-weight: 600; color: #2E2B15;">Teléfono</label>
        <input id="telefono" name="Teléfono" type="tel" autocomplete="tel" placeholder="+598" style="border: 1px solid #D9D3BE; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: 'Poppins', sans-serif; color: #2E2B15;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="mensaje" style="font-size: 13px; font-weight: 600; color: #2E2B15;">Mensaje</label>
        <textarea id="mensaje" name="Mensaje" rows="4" placeholder="Contanos brevemente tu consulta" style="border: 1px solid #D9D3BE; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: 'Poppins', sans-serif; color: #2E2B15; resize: none;"></textarea>
      </div>

      <button type="submit" class="btn btn-solid" style="background: #69662C; color: #FFFFFF; border: none; border-radius: 999px; padding: 14px; font-size: 15px; font-weight: 600; font-family: 'Poppins', sans-serif; cursor: pointer;">{{contacto_form_button}}</button>
    </form>

  </div>
</section>
